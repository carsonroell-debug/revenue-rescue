[project]
name = "revenue-rescue"
version = "0.4.0"
description = "LinkRescue: affiliate link recovery audits for publishers"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "scrapling[fetchers]==0.4.15",
    "fastmcp==4.0.10",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.35,<1",
    "crawlee[beautifulsoup]==1.10.3",
    "psycopg[binary]==3.3.6",
]

[tool.vercel]
entrypoint = "revenuerescue.server:app"
