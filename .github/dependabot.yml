version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "fastmcp"
          - "starlette"
          - "uvicorn"
          - "psycopg*"
      crawling:
        patterns:
          - "crawlee*"
          - "scrapling*"
          - "beautifulsoup4"
          - "requests"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
